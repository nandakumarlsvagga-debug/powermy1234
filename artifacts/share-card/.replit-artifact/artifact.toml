kind = "api"
previewPath = "/share-card"
title = "Share Card Renderer"
version = "1.0.0"
id = "share-card"

[[services]]
localPort = 8081
name = "Share Card Renderer"
paths = ["/share-card"]

[services.development]
run = "pnpm --filter @workspace/share-card run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/share-card", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/share-card/dist/index.mjs"]

[services.production.run.env]
PORT = "8081"
NODE_ENV = "production"

[services.production.health.startup]
path = "/share-card/healthz"
