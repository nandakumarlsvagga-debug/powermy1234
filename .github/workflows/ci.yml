name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck (workspace root)
        run: pnpm run typecheck

  test-unit:
    name: Unit & Property Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and property tests (all packages)
        run: pnpm -r run test
        env:
          VITEST: "true"
          # Minimal stubs so packages that reference env vars don't crash at import time
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_ANON_KEY: "stub"
          SUPABASE_SERVICE_ROLE_KEY: "stub"
          DATABASE_URL: "postgresql://stub@localhost/stub"
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: "stub"
          AWS_SECRET_ACCESS_KEY: "stub"
          APP_BASE_URL: "http://localhost:3000"
          PLVL_ANON_COOKIE_SECRET: "test-secret-32-bytes-minimum-here"
          INTERNAL_JOB_SECRET: "test-internal-secret"

  test-integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powerlvl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm -r run test:integration --if-present
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/powerlvl_test"
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_ANON_KEY: "stub"
          SUPABASE_SERVICE_ROLE_KEY: "stub"
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: "stub"
          AWS_SECRET_ACCESS_KEY: "stub"
          APP_BASE_URL: "http://localhost:3000"
          PLVL_ANON_COOKIE_SECRET: "test-secret-32-bytes-minimum-here"
          INTERNAL_JOB_SECRET: "test-internal-secret"

  build-web:
    name: Build Web Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web client
        run: pnpm --filter @workspace/web run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder"

  bundle-scan:
    name: Bundle Security Scan
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web client (for bundle scan)
        run: pnpm --filter @workspace/web run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder"

      - name: Run bundle security scan
        run: pnpm --filter @workspace/scripts run bundle-scan

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (all packages)
        run: pnpm -r run lint --if-present

  anchor-tests:
    name: Scoring Anchor Tests (Cultural Reputation Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scoring anchor tests
        # CI MUST FAIL if any anchor regresses — they encode the product's
        # cultural reputation and cannot drift silently (per tasks.md 2.8).
        run: pnpm --filter @workspace/scoring run test -- --reporter=verbose
        env:
          VITEST: "true"

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - test-unit
      - build-web
      - bundle-scan
      - anchor-tests
    steps:
      - name: All checks green
        run: echo "All CI checks passed"
